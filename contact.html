<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Osemwengie Arit Bright" />
    <meta name="description" content="Arit Portfolio Website" />
    <title>Arit Bright | Portfolio</title>
    <link rel="icon" href="img/logo.svg" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html"> arit </a>

        <button
          class="nav-toggle"
          id="navToggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="mainNav"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav id="mainNav">
          <a href="index.html">home</a>
          <a href="about.html">about</a>
          <a href="resume.html">resume</a>
          <a href="project.html">projects</a>
          <a href="services.html">services</a>
          <a href="contact.html" class="contact">contact me</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="form-container">
        <div class="form-text">
          <h2>let’s collaborate</h2>
          <p>Have a project in mind or need guidance?</p>
        </div>
        <div class="form-card">
          <p class="connect">let’s connect.</p>

          <form action="#">
            <div class="user-details">
              <div class="input-box">
                <label for="firstname">first name</label>
                <input type="text" required />
              </div>

              <div class="input-box">
                <label for="lastname">last name</label>
                <input type="text" required />
              </div>

              <div class="input-box">
                <label for="email">email address</label>
                <input type="email" required />
              </div>

              <div class="input-box">
                <label for="phone">phone number</label>
                <input type="phone" required />
              </div>

              <div class="input-box">
                <label for="dob">date of birth</label>
                <input type="date" required />
              </div>

              <div class="input-box">
                <label for="subject">subject</label>
                <input type="text" required />
              </div>
            </div>
            <div class="input-details">
              <textarea
                id="message"
                rows="5"
                placeholder="Message"
                required
              ></textarea>
            </div>
            <button class="submit">send message</button>
          </form>

          <div class="social-links">
            <a
              href="https://github.com/osemwengiearit"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub"
              ><i class="fab fa-github"></i
            ></a>
            <a
              href="https://www.linkedin.com/in/osemwengie-arit-bright-a84a28159/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
              ><i class="fab fa-linkedin"></i
            ></a>
            <a
              href="https://x.com/arit_bright"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Twitter"
              ><i class="fab fa-twitter"></i
            ></a>
            <a
              href="https://www.instagram.com/arit_bright"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram"
              ><i class="fab fa-instagram"></i
            ></a>
            <a
              href="https://web.facebook.com/osemwengie.arit.bright"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Facebook"
              ><i class="fab fa-facebook"></i
            ></a>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <p>
          &copy; <span id="year"></span> Osemwengie Arit Bright — All rights
          reserved.
        </p>
      </div>
    </footer>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
